name: 更新开奖数据

# 每天北京时间 22:40（UTC 14:40）抓一次官方开奖数据并提交，
# GitHub Pages 自动发布后，页面打开就是最新一期。
on:
  schedule:
    - cron: '40 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取官方开奖数据
        run: python tools/fetch_data.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新开奖数据"
            git push
          fi

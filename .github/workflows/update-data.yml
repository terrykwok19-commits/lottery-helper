name: 更新开奖数据

# 开奖时间：快乐8 每天 21:30、双色球 周二/四/日 21:15、大乐透 周一/三/六 21:25（北京时间）
# 500 彩票网的静态 XML 一般在开奖后 20~30 分钟更新，所以当晚多跑几次，谁先拿到就谁生效。
on:
  schedule:
    # UTC = 北京时间 - 8 小时
    - cron: '10 14 * * *'   # 22:10
    - cron: '45 14 * * *'   # 22:45
    - cron: '20 15 * * *'   # 23:20
    - cron: '30 23 * * *'   # 次日 07:30（兜底昨晚延迟发布的数据）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lottery-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取开奖数据（多源 + 偏旧自动重试）
        id: fetch
        run: |
          set +e
          python tools/fetch_data.py --keep 200 --retry 2
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: 输出数据状态
        if: always()
        run: |
          python - <<'PY'
          import json, glob
          for f in sorted(glob.glob('data/*.json')):
              d = json.load(open(f, encoding='utf-8'))
              print(f"{d['game']:4s} latest={d['latest']:9s} date={d['latestDate']:12s} "
                    f"source={d.get('source','-')} updated={d.get('updated','-')}")
          PY

      - name: 提交变更
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新开奖数据"
            git push
          fi
